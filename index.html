<!DOCTYPE html>
<html>
<head>
    <title>StudyTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>StudyTrack</h1>
        <p>Your personal study manager</p>
        <div class="welcome">
            <h2>Welcome, Student! 👋</h2>
            <p> Track your subjects,study time,and daily tasks.</p>
        </div>
        <div class="dashboard">
            <div class="card">
                <h3>Study Timer ⏱️</h3>
                <p id="timer">25:00</p>
                <p id="timerMessage"></p>
                <button onclick="startTimer()">Start</button>
                <button onclick="pauseTimer()">Pause</button>
                <button onclick="resetTimer()">Reset</button>
            </div>

            <div class="card">
                <h3>Today's Study 📚</h3>
                <p class="number" id="studyTime">0 min</p>
                <p id="studyGoal">0 / 60 min studied</p>
            </div>
            <div class="card">
                <h3>Subjects 📚</h3>
                <p class="number"
                id="subjectCount">0</p>
                <p id="subjectMessage">0 subjects added</p>
                <form id="subjectForm">
                    <input
                    type="text"
                    id="subjectInput"
                    placeholder="Enter subject name"
                    maxlength="50"
                    required
                    >
                    <button type="submit">➕ Add Subject</button>
                </form>
                <ul id="subjectList"></ul>
                <button onclick="clearAllSubjects()">Clear All Subjects</button>
            </div>
            <div class="card">
                <h3>Tasks ✅</h3>
                <p class="number" id="taskCount">0</p>
                <p id="taskProgress">0 / 0 completed</p>
                <form id="taskForm">
                    <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a task"
                    maxlength="100"
                    required
                    >
                    <button type ="submit">➕ Add Task</button>
                </form>
                <ul id="taskList"></ul>
                <button onclick="clearCompletedTasks()">Clear Completed</button>
                <button onclick="clearAllTasks()">Clear All Tasks</button>
            </div>
            
            
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
